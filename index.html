<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atrapa el Premio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08132e;color:white;font-family:Arial;text-align:center}
h1{color:#ffd34c;font-size:28px;margin:14px 0 5px}
p{margin:8px}
button{background:#ffcb35;color:#162039;border:0;border-radius:12px;padding:13px 18px;font-weight:bold;margin:5px}
canvas{display:block;width:min(96vw,420px);height:auto;margin:12px auto;border:3px solid #d9a83a;border-radius:18px;touch-action:none;background:linear-gradient(#10285b,#060c21)}
#info{font-weight:bold}
</style>
</head>
<body>
<h1>🏆 Atrapa el Premio</h1>
<p>¡Atrapa monedas y evita las bombas!</p>
<div id="menu">
<button onclick="start(false)">🎮 Aventura</button>
<button onclick="start(true)">⭐ Desafío diario</button>
</div>
<p id="info">Elige cómo jugar</p>
<canvas id="game" width="360" height="500"></canvas>
<p id="record"></p>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let items=[],basket=180,score=0,level=1,life=3,time=45,playing=false,daily=false,last=0,spawn=0,seed=1;
const goals=[120,240,360],date=new Date().toLocaleDateString('en-CA');
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function start(d){daily=d;level=1;score=0;life=3;seed=d?Number(date.replaceAll('-','')):Date.now()>>>0;begin()}
function begin(){items=[];time=45;spawn=0;playing=true;last=performance.now();requestAnimationFrame(frame)}
function move(e){let r=c.getBoundingClientRect();basket=Math.max(38,Math.min(322,(e.clientX-r.left)*360/r.width))}
c.addEventListener('pointermove',move);
c.addEventListener('pointerdown',move);
function frame(t){
if(!playing)return;
let dt=Math.min((t-last)/1000,.05);last=t;time-=dt;spawn-=dt;
if(spawn<=0){let n=rnd();items.push({x:25+rnd()*310,y:-20,bomb:n<.22,r:14,speed:110+level*35+rnd()*65});spawn=Math.max(.23,.65-level*.09)}
x.clearRect(0,0,360,500);
x.fillStyle='#ffffff18';for(let i=0;i<35;i++)x.fillRect((i*79)%360,(i*137)%500,2,2);
for(let i=items.length-1;i>=0;i--){
let a=items[i];a.y+=a.speed*dt;
x.font='29px Arial';x.textAlign='center';x.fillText(a.bomb?'💣':'🪙',a.x,a.y);
if(a.y>440&&a.y<480&&Math.abs(a.x-basket)<37){
if(a.bomb)life--;else score+=10;items.splice(i,1);
}else if(a.y>510)items.splice(i,1);
}
x.font='58px Arial';x.fillText('🧺',basket,475);
document.getElementById('info').textContent=(daily?'Desafío diario':'Nivel '+level)+' | Puntos: '+score+' | ❤️ '+life+' | ⏱ '+Math.ceil(time);
if(life<=0||time<=0){
playing=false;
if(life>0&&(daily||score>=goals[level-1])){
if(!daily&&level<3){level++;life=3;setTimeout(begin,900);return}
let key=daily?'diario-'+date:'aventura';
let best=Math.max(score,Number(localStorage.getItem(key)||0));localStorage.setItem(key,best);
document.getElementById('info').textContent='🏆 ¡Terminaste! Puntos: '+score;
document.getElementById('record').textContent='Tu récord: '+best;
}else document.getElementById('info').textContent='💥 Fin del juego. Puntos: '+score+' ¡Intenta otra vez!';
return;
}
requestAnimationFrame(frame);
}
x.font='70px Arial';x.textAlign='center';x.fillText('🧺',180,300);
</script>
</body>
</html>
